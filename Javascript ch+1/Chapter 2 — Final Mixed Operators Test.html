<body>
    <h1>Chapter 2 — Final Mixed Operators Test</h1>
    <script>
        let x = 5;
        let y = 10;

        console.log(x + y / 2);
        console.log((x + y) / 2);
        console.log(x < y && y === 10);

        let a = 8;
        let b = 4;

        console.log(a + b * 2);
        console.log((a + b) * 2);
    </script>
