<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript logical operators 🧠</title>
   <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: black;
            color: white;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        </style>
</head>
<body>
    <h1>JavaScript Logical Operators 🧠</h1>
    <script>
        let age = 17;
        let hasTickets = true;

        console.log(age >= 13 && hasTickets);
        console.log( age >= 18 || hasTickets);
        console.log(!hasTickets);
    </script>
</body>
</html>
