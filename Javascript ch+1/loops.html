<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Loops</title>
</head>
<body>
    <p>creating loops.</p>
    <script>
        for (let i = 1; i <= 5; i++){
            console.log("hello Subhan");
        }
        for(let i = 1; i <= 5; i++){
            console.log("Product number:", i);
        }

        // my turn ------

        for(let a = 1; a <= 10; a++){
            console.log("printing number:", a);
        }

        // for while 

        let i = 1;
        
        while (i <= 5){
            console.log(i);
            i++;
        }
    </script>
</body>
</html>
